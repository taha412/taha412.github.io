<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" role="img" aria-labelledby="title desc"><title id="title">Terrain update path</title><desc id="desc">Coordinates produce RAM addresses. The current height and brush calculation feed a raise/lower stage. A selector chooses the brush result or a preset map value for write-back. Simplified from slide 14.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10" fill="#8cbcff"/></marker></defs><rect width="100%" height="100%" fill="#161d25"/><path d="M215 67H305" fill="none" stroke="#8cbcff" stroke-width="1.4" marker-end="url(#arrow)"/><path d="M495 67H585" fill="none" stroke="#8cbcff" stroke-width="1.4" marker-end="url(#arrow)"/><path d="M680 100V155H400V225" fill="none" stroke="#8cbcff" stroke-width="1.4" marker-end="url(#arrow)"/><path d="M215 262H305" fill="none" stroke="#8cbcff" stroke-width="1.4" marker-end="url(#arrow)"/><path d="M495 262H585" fill="none" stroke="#8cbcff" stroke-width="1.4" marker-end="url(#arrow)"/><path d="M725 225V100" fill="none" stroke="#8cbcff" stroke-width="1.4" marker-end="url(#arrow)"/><rect x="25" y="35" width="190" height="65" rx="4" fill="#10151b" stroke="#53749f"/><text x="120.0" y="64.5" text-anchor="middle" fill="#e3e9f0" font-family="Arial,sans-serif" font-size="15">Cell coordinates</text><text x="120.0" y="85.5" text-anchor="middle" fill="#a0acba" font-family="Arial,sans-serif" font-size="12">Next-cell prediction</text><rect x="305" y="35" width="190" height="65" rx="4" fill="#10151b" stroke="#53749f"/><text x="400.0" y="64.5" text-anchor="middle" fill="#e3e9f0" font-family="Arial,sans-serif" font-size="15">Address calculation</text><text x="400.0" y="85.5" text-anchor="middle" fill="#a0acba" font-family="Arial,sans-serif" font-size="12">Read / write address</text><rect x="585" y="35" width="190" height="65" rx="4" fill="#10151b" stroke="#53749f"/><text x="680.0" y="64.5" text-anchor="middle" fill="#e3e9f0" font-family="Arial,sans-serif" font-size="15">Height RAM</text><text x="680.0" y="85.5" text-anchor="middle" fill="#a0acba" font-family="Arial,sans-serif" font-size="12">Current cell height</text><rect x="25" y="225" width="190" height="75" rx="4" fill="#10151b" stroke="#53749f"/><text x="120.0" y="259.5" text-anchor="middle" fill="#e3e9f0" font-family="Arial,sans-serif" font-size="15">Brush calculation</text><text x="120.0" y="280.5" text-anchor="middle" fill="#a0acba" font-family="Arial,sans-serif" font-size="12">Cursor + radius + scale</text><rect x="305" y="225" width="190" height="75" rx="4" fill="#10151b" stroke="#53749f"/><text x="400.0" y="259.5" text-anchor="middle" fill="#e3e9f0" font-family="Arial,sans-serif" font-size="15">Raise / lower</text><text x="400.0" y="280.5" text-anchor="middle" fill="#a0acba" font-family="Arial,sans-serif" font-size="12">Apply height change</text><rect x="585" y="225" width="190" height="75" rx="4" fill="#10151b" stroke="#53749f"/><text x="680.0" y="259.5" text-anchor="middle" fill="#e3e9f0" font-family="Arial,sans-serif" font-size="15">Write selection</text><text x="680.0" y="280.5" text-anchor="middle" fill="#a0acba" font-family="Arial,sans-serif" font-size="12">Brush result or preset</text><text x="420" y="144" text-anchor="middle" fill="#a0acba" font-family="Arial,sans-serif" font-size="11">current height</text><text x="260" y="249" text-anchor="middle" fill="#a0acba" font-family="Arial,sans-serif" font-size="11">height delta</text><text x="750" y="174" text-anchor="middle" fill="#a0acba" font-family="Arial,sans-serif" font-size="11">write-back</text></svg>