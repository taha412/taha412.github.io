<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 540" role="img" aria-labelledby="title desc"><title id="title">Alterraform system overview</title><desc id="desc">Mouse and board inputs feed main control, which coordinates terrain memory. Terrain colors and the VGA adapter form a vertically aligned display path below main control. Simplified system view.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10" fill="#8cbcff" /></marker></defs><rect width="100%" height="100%" fill="#161d25" /><path d="M225 62H260V100H300" fill="none" stroke="#8cbcff" stroke-width="1.4" marker-end="url(#arrow)" /><path d="M225 167H260V145H300" fill="none" stroke="#8cbcff" stroke-width="1.4" marker-end="url(#arrow)" /><path d="M520 105H595" fill="none" stroke="#8cbcff" stroke-width="1.4" marker-end="url(#arrow)" /><path d="M595 145H520" fill="none" stroke="#8cbcff" stroke-width="1.4" marker-end="url(#arrow)" /><path d="M410 175V260" fill="none" stroke="#8cbcff" stroke-width="1.4" marker-end="url(#arrow)" /><path d="M410 330V400" fill="none" stroke="#8cbcff" stroke-width="1.4" marker-end="url(#arrow)" /><rect x="25" y="30" width="200" height="65" rx="4" fill="#10151b" stroke="#53749f" /><text x="125.0" y="59.5" text-anchor="middle" fill="#e3e9f0" font-family="Arial,sans-serif" font-size="15">PS/2 mouse interface</text><text x="125.0" y="80.5" text-anchor="middle" fill="#a0acba" font-family="Arial,sans-serif" font-size="12">Controller + interpreter</text><rect x="25" y="135" width="200" height="65" rx="4" fill="#10151b" stroke="#53749f" /><text x="125.0" y="164.5" text-anchor="middle" fill="#e3e9f0" font-family="Arial,sans-serif" font-size="15">Switches and keys</text><text x="125.0" y="185.5" text-anchor="middle" fill="#a0acba" font-family="Arial,sans-serif" font-size="12">Modes + map presets</text><rect x="300" y="75" width="220" height="100" rx="4" fill="#10151b" stroke="#53749f" 